name: Validate mods
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate generated recipes
        run: node tools/verify.mjs
      - name: Verify installation ZIP generation
        run: python3 tools/build.py
