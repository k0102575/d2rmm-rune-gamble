name: Publish experimental release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check release version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('mods/ProbabilisticRuneDowngrade/mod.json').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match mod.json version'
          PY

      - name: Validate generated recipes
        run: node tools/verify.mjs

      - name: Build and verify installation ZIP
        run: python3 tools/build.py

      - name: Upload assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --draft --prerelease \
            --title "Probabilistic Rune Downgrade $GITHUB_REF_NAME (Experimental)" \
            --notes-file docs/RELEASE_NOTES.ko.md
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          gh release view "$GITHUB_REF_NAME" --json url,isDraft,isPrerelease,assets
