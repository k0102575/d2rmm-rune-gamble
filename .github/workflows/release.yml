name: Publish experimental release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.1.0-alpha.2
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check release version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('mods/ProbabilisticRuneDowngrade/mod.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match mod.json version'
          PY

      - name: Validate generated recipes
        run: node tools/verify.mjs

      - name: Build and verify installation ZIP
        run: python3 tools/build.py

      - name: Upload assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --prerelease \
            --title "Probabilistic Rune Downgrade $RELEASE_TAG (Experimental)" \
            --notes-file docs/RELEASE_NOTES.ko.md
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets
