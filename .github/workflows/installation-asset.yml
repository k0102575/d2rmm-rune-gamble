name: Refresh release documentation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minimal-installation-asset
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate installation generator
        run: node tools/verify.mjs
      - name: Build and verify ZIPs
        run: python3 tools/build.py
      - name: Replace documentation archive and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="v$(python3 -c "import json; print(json.load(open('ProbabilisticRuneDowngrade/mod.json'))['version'])")"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease
          RELEASE_VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "dist/ProbabilisticRuneDowngrade-${RELEASE_VERSION}.zip" \
            "dist/ProbabilisticRuneDowngrade-${RELEASE_VERSION}.zip.sha256" --clobber
          gh release edit "$RELEASE_TAG" --notes-file ProbabilisticRuneDowngrade/docs/RELEASE_NOTES.ko.md
          gh release view "$RELEASE_TAG" --json url,assets
